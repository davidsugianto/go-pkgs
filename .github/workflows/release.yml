name: Release

on:
  push:
    branches: [ master, main ]
    paths:
      - 'grace/**'
      - 'httpclient/**'
      - 'pagination/**'
      - 'config/**'
      - 'response/**'
      - 'redis/**'
      - 'logger/**'
      - 'otel/**'
      - 'db/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Detect changed packages
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          PACKAGES=""

          for pkg in grace httpclient pagination config response redis logger otel db; do
            if echo "$CHANGED_FILES" | grep -q "^$pkg/"; then
              if [ -z "$PACKAGES" ]; then
                PACKAGES="$pkg"
              else
                PACKAGES="$PACKAGES,$pkg"
              fi
            fi
          done

          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          echo "Detected packages: $PACKAGES"

      - name: Create releases
        if: steps.detect.outputs.packages != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PACKAGES="${{ steps.detect.outputs.packages }}"
          IFS=',' read -ra PKG_ARRAY <<< "$PACKAGES"

          for pkg in "${PKG_ARRAY[@]}"; do
            echo "Processing package: $pkg"

            # Get the latest tag for this package
            LATEST_TAG=$(git tag -l "${pkg}/v*" --sort=-version:refname | head -n1)

            if [ -z "$LATEST_TAG" ]; then
              NEW_VERSION="${pkg}/v0.1.0"
              CURRENT_VERSION="none"
            else
              CURRENT_VERSION="$LATEST_TAG"

              VERSION_NUM=$(echo "$LATEST_TAG" | sed "s|${pkg}/v||")
              IFS='.' read -ra PARTS <<< "$VERSION_NUM"
              MAJOR=${PARTS[0]}
              MINOR=${PARTS[1]}
              PATCH=${PARTS[2]}

              # Auto-detect bump type based on commit messages
              COMMITS=$(git log --pretty=format:"%s" HEAD~1..HEAD)
              if echo "$COMMITS" | grep -qiE "^(feat|feature)"; then
                BUMP="minor"
              elif echo "$COMMITS" | grep -qiE "^(fix|patch)"; then
                BUMP="patch"
              elif echo "$COMMITS" | grep -qiE "^(break|major)"; then
                BUMP="major"
              else
                BUMP="patch"
              fi

              case $BUMP in
                major)
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                  ;;
                minor)
                  MINOR=$((MINOR + 1))
                  PATCH=0
                  ;;
                patch)
                  PATCH=$((PATCH + 1))
                  ;;
              esac

              NEW_VERSION="${pkg}/v${MAJOR}.${MINOR}.${PATCH}"
            fi

            echo "Current version: $CURRENT_VERSION"
            echo "New version: $NEW_VERSION"

            # Generate changelog
            if [ "$CURRENT_VERSION" = "none" ]; then
              CHANGELOG="Initial release for ${pkg} package.\n\n## Installation\n\n\`\`\`bash\ngo get github.com/davidsugianto/go-pkgs/${pkg}@${NEW_VERSION}\n\`\`\`\n\n## Documentation\n\nSee README for details."
            else
              CHANGELOG="## What's Changed\n\n"
              if git rev-parse "$CURRENT_VERSION" >/dev/null 2>&1; then
                COMMITS=$(git log --pretty=format:"- %s (%h)" "$CURRENT_VERSION"..HEAD -- "$pkg/")
                CHANGELOG="${CHANGELOG}${COMMITS}"
              else
                CHANGELOG="${CHANGELOG}Updated ${pkg} package"
              fi
              CHANGELOG="${CHANGELOG}\n\n## Installation\n\n\`\`\`bash\ngo get github.com/davidsugianto/go-pkgs/${pkg}@${NEW_VERSION}\n\`\`\`\n\n**Full Changelog**: https://github.com/${REPOSITORY}/compare/${CURRENT_VERSION}...${NEW_VERSION}"
            fi

            # Create tag
            git tag "$NEW_VERSION"
            git push origin "$NEW_VERSION"

            # Create GitHub release
            echo -e "$CHANGELOG" | gh release create "$NEW_VERSION" \
              --title "$pkg $NEW_VERSION" \
              --notes-file - \
              --latest=false

            echo "Released $NEW_VERSION"
          done

      - name: Summary
        if: steps.detect.outputs.packages != ''
        run: |
          echo "## Releases Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PACKAGES="${{ steps.detect.outputs.packages }}"
          IFS=',' read -ra PKG_ARRAY <<< "$PACKAGES"
          for pkg in "${PKG_ARRAY[@]}"; do
            echo "- \`${pkg}\`" >> $GITHUB_STEP_SUMMARY
          done
